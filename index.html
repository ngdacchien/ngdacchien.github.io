<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NgChien - Dynamic Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background-color: #0b0e14 !important;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 40px;
        }

        .dark-card {
            background-color: #141821 !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 16px !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .btn-social {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border-radius: 50rem;
            padding: 6px 16px;
            font-size: 0.825rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-social:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .profile-art-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 420px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-center-img {
            position: absolute;
            width: 220px;
            height: auto;
            max-height: 380px;
            object-fit: contain;
            z-index: 3;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.95));
        }

        .profile-side-left-container, .profile-side-right-container {
            position: absolute;
            top: 20px;
            width: 180px;
            height: 290px;
            z-index: 1;
        }
        .profile-side-left-container { left: 10px; }
        .profile-side-right-container { right: 10px; }

        /* Style chung cho ảnh và khung trống (placeholder) */
        .profile-side-item {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            filter: brightness(0.9);
            background-color: rgba(255, 255, 255, 0.03); /* Màu nền nhẹ cho khung trống */
        }
        
        /* Hiệu ứng khi khung trống hiển thị */
        .profile-side-item.empty-slot {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-4" href="#">𓍯𓂃𓏧 NgChien</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center my-4">
            <div class="col-12 col-xl-8">
                <div class="dark-card p-4 mb-4 text-center position-relative" id="profile-container">
                    <div class="text-secondary py-5">Đang tải dữ liệu...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'sb_publishable_-xJK8312WwzmeSTmE26CqQ_Yr70gkW0'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmemlzc2RqZHZqdnpvYnFhYmFpIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODgzNDk4NiwiZXhwIjoyMTA0NDEwOTg2fQ.e9IYhsr9DN5sMjCjT1wHebzEWH6cN2hFKJUUJu47NDA'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProfile() {
            try {
                let { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .limit(1)
                    .single();

                if (error || !data) {
                    document.getElementById('profile-container').innerHTML = '<p class="text-danger">Không thể tải dữ liệu profile!</p>';
                    return;
                }

                // Xử lý mảng ảnh trái (nếu mảng rỗng thì tự sinh 1 khung trống)
                let leftImages = (data.left_images && data.left_images.length > 0) ? data.left_images : [''];
                let leftHtml = '';
                leftImages.forEach((imgUrl, index) => {
                    let rotateDeg = -12 - (index * 4);
                    if (imgUrl) {
                        leftHtml += `<img src="${imgUrl}" alt="Left Image" class="profile-side-item" style="transform: rotate(${rotateDeg}deg); z-index: ${index + 1};">`;
                    } else {
                        leftHtml += `<div class="profile-side-item empty-slot" style="transform: rotate(${rotateDeg}deg); z-index: ${index + 1};"><i class="bi bi-image fs-3"></i></div>`;
                    }
                });

                // Xử lý mảng ảnh phải (nếu mảng rỗng thì tự sinh 1 khung trống)
                let rightImages = (data.right_images && data.right_images.length > 0) ? data.right_images : [''];
                let rightHtml = '';
                rightImages.forEach((imgUrl, index) => {
                    let rotateDeg = 12 + (index * 4);
                    if (imgUrl) {
                        rightHtml += `<img src="${imgUrl}" alt="Right Image" class="profile-side-item" style="transform: rotate(${rotateDeg}deg); z-index: ${index + 1};">`;
                    } else {
                        rightHtml += `<div class="profile-side-item empty-slot" style="transform: rotate(${rotateDeg}deg); z-index: ${index + 1};"><i class="bi bi-image fs-3"></i></div>`;
                    }
                });

                const container = document.getElementById('profile-container');
                container.innerHTML = `
                    <button class="btn btn-sm text-secondary position-absolute top-0 end-0 m-3 rounded-circle border-0" style="background: rgba(255,255,255,0.05); z-index: 10;">
                        <i class="bi bi-share-fill"></i>
                    </button>

                    <div class="profile-art-wrapper my-2">
                        <div class="profile-side-left-container">${leftHtml}</div>
                        <img src="${data.center_image_url || ''}" alt="Main Character" class="profile-center-img">
                        <div class="profile-side-right-container">${rightHtml}</div>
                    </div>

                    <h3 class="fw-bold text-warning fst-italic mt-3 mb-1 d-flex align-items-center justify-content-center gap-1" style="position: relative; z-index: 5;">
                        ${data.display_name} 
                        <i class="bi bi-patch-check-fill text-warning fs-5" title="Xác minh"></i>
                    </h3>

                    <div class="d-flex justify-content-center gap-2 mt-3" style="position: relative; z-index: 5;">
                        <a href="${data.tiktok_url || '#'}" target="_blank" class="btn-social"><i class="bi bi-tiktok"></i> TikTok</a>
                        <a href="${data.facebook_url || '#'}" target="_blank" class="btn-social"><i class="bi bi-facebook"></i> Facebook</a>
                        <a href="${data.chat_url || '#'}" class="btn-social"><i class="bi bi-chat-dots-fill"></i> Chat</a>
                    </div>
                `;
            } catch (err) {
                console.error('Lỗi tải profile:', err);
            }
        }

        loadProfile();
    </script>
</body>
</html>

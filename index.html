<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Cá Nhân</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; }
        .badge { display: inline-block; background: #0284c7; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Ngô Đắc Chiến</h2>
        <p>Full-stack Developer & Tech Enthusiast</p>
        <div class="badge">Đang hoạt động</div>
    </div>
</body>
</html>
